name: CI

# Pull-request gate for wkx-hello: the Python gate block from python.md, then a
# native ARM container build. This workflow does NO ECR push, NO deploy-bundle
# upload, and NO deploy; those arrive with the deploy workflow in the next M6
# ticket.
on:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        # No version argument: honours .python-version, so CI needs no edit when
        # the project's Python version moves.
        run: uv python install

      - name: Install dependencies (fails on a stale lockfile)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: ty type check
        run: uv run ty check

      - name: pytest
        run: uv run pytest

  build:
    needs: gates
    # Native ARM build on GitHub's stable ARM runner label (ADR 0005), so the
    # arm64 image is built without QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the arm64 image (build only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          # provenance and SBOM are OFF deliberately (ADR 0025). Buildx's default
          # provenance attestation wraps the image in an OCI image index that ECR
          # silently refuses to scan; disabling both ships a plain, scannable
          # manifest so ECR (and the pipeline's Trivy gate) can inspect it.
          provenance: false
          sbom: false
